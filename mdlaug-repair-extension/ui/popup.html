<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mDLAUG Repair</title>
<style>
  :root{--ink:#12211d;--paper:#f3f1e9;--pine:#12332e;--teal:#1f9e8f;--berry:#b1315e;--gold:#f4c542}
  *{box-sizing:border-box}
  body{width:340px;margin:0;padding:14px;background:var(--paper);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:15px;margin:0 0 2px;letter-spacing:.02em}
  p.sub{margin:0 0 12px;font-size:12px;color:#4a5a54}
  button{font:inherit;border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:600}
  #run{background:var(--pine);color:#eef7f4;width:100%}
  #run[aria-pressed="true"]{background:var(--berry)}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{flex:1;background:var(--teal);color:#04231f}
  label.auto{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
  #report{margin-top:12px;max-height:260px;overflow:auto}
  #report ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  #report li{font-size:12.5px;background:#fff;border:1px solid #d7ddd8;border-radius:8px;padding:8px}
  .code{font:600 11px/1 ui-monospace,monospace;background:var(--pine);color:#eef7f4;padding:3px 5px;border-radius:4px;margin-right:5px}
  .flag{font:600 10px/1 ui-monospace,monospace;background:var(--gold);color:#3a2c00;padding:3px 5px;border-radius:4px;margin-right:5px}
  a{color:#0d5c50}
</style>
</head>
<body>
  <h1>mDLAUG Repair</h1>
  <p class="sub">Fix the 24 screen-reader barriers on this page.</p>
  <button id="run" aria-pressed="false">Repair this page</button>
  <button id="assess" style="width:100%;margin-top:8px;background:#b1315e;color:#fff">Audit this page</button>
  <div class="row">
    <button id="reader">Reading Room</button>
    <button id="dashboard">Dashboard</button>
  </div>
  <div class="row">
    <button id="studio">Conversion studio</button>
  </div>
  <label class="auto"><input type="checkbox" id="autoRun"> Repair pages automatically</label>
  <div id="report" role="region" aria-label="Repair report"></div>
  <script src="popup.js"></script>
</body>
</html>
