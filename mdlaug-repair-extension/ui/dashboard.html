<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mDLAUG dashboard</title>
<style>
  :root{--ink:#12211d;--paper:#f3f1e9;--pine:#12332e;--teal:#1f9e8f;--amber:#e8912a;--berry:#b1315e;--gold:#f4c542;--line:#d7ddd8;--mut:#5a6a63;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--pine);color:#eef7f4;padding:16px 24px;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--gold)}
  header h1{margin:0;font-size:18px}
  header .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  select,button{font:inherit;border-radius:8px;padding:7px 11px;border:0;cursor:pointer}
  select{background:#fff;color:var(--ink);font-weight:500}
  button{font-weight:600;background:var(--gold);color:#3a2c00}
  button.ghost{background:transparent;color:#eef7f4;border:1px solid rgba(255,255,255,.5)}
  button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #status{font-size:13px;color:#dfeee9}
  main{max-width:920px;margin:0 auto;padding:22px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:130px}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:12px;color:var(--mut)}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  section.card h2{font-size:15px;margin:0 0 4px}
  section.card p.hint{font-size:12.5px;color:var(--mut);margin:0 0 12px}
  .levels{display:flex;gap:14px;flex-wrap:wrap}
  .lvltile{flex:1;min-width:150px;border-radius:12px;padding:14px 16px;color:#fff}
  .lvltile.A{background:var(--teal);color:#04231f}.lvltile.AA{background:var(--amber);color:#3a2400}.lvltile.AAA{background:var(--berry)}
  .lvltile b{display:block;font-size:26px}.lvltile span{font-size:12px;opacity:.9}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{border-bottom:1px solid var(--line);padding:5px 7px;text-align:left}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .warn{background:#fff6e6;border:1px solid #f0d9a0;border-radius:10px;padding:12px 14px;font-size:13px}
  a{color:#0d5c50}
</style>
</head>
<body>
<header>
  <h1>mDLAUG dashboard</h1>
  <div class="row">
    <label for="lib" style="font-size:13px">Library:</label>
    <select id="lib"><option value="">All libraries</option></select>
    <button id="refresh" class="ghost">Refresh</button>
    <button id="csv" class="ghost">Export CSV</button>
    <button id="json" class="ghost">Export JSON</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>
</header>
<main id="main">
  <div class="stats" id="stats"></div>
  <section class="card">
    <h2>Compliance by situation</h2>
    <p class="hint">Average 1–7 score across the selected audits. Bar colour = conformance level.</p>
    <div class="legend"><span><i style="background:var(--teal)"></i>Level A</span><span><i style="background:var(--amber)"></i>Level AA</span><span><i style="background:var(--berry)"></i>Level AAA</span></div>
    <div id="bysit"></div>
  </section>
  <section class="card">
    <h2>By conformance level</h2>
    <p class="hint">Weighted average score for each WCAG-style tier.</p>
    <div class="levels" id="bylevel"></div>
  </section>
  <section class="card">
    <h2>Trend over time</h2>
    <p class="hint">Overall average score per audit, oldest to newest.</p>
    <div id="trend"></div>
  </section>
</main>
<script src="../engine/turso.js"></script>
<script src="../engine/store.js"></script>
<script src="dashboard-page.js"></script>
</body>
</html>
